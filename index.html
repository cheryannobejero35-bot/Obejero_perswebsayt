<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YūYū Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;

      background-image: url("front.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 28px 30px;

      background: rgba(45, 25, 38, 0.60);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 2px solid #dfbd71;
      border-radius: 25px;

      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);

      text-align: center;
    }

    /* YūYū LOGO */

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 55px;
    }

    /* Actual gold hibiscus flower image */

    .logo-flower {
      width: 100px;
      height: 100px;
      object-fit: contain;
      display: block;
      margin-bottom: 5px;

      filter: drop-shadow(
        0 4px 5px rgba(0, 0, 0, 0.35)
      );
    }

    .logo-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 43px;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1.2;

      color: #ffdc83;

      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.7),
        0 0 8px rgba(255, 215, 120, 0.25);
    }

    .logo-subtitle {
      margin-top: 10px;

      color: #f7e5b7;
      font-size: 11px;
      letter-spacing: 4px;
    }

    /* LOGIN FORM */

    h2 {
      color: #fffaf0;
      font-size: 36px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 17px 16px;
      margin-bottom: 18px;

      border: 1.5px solid #e4c77e;
      border-radius: 13px;
      outline: none;

      background: #fffaf1;
      color: #48222c;
      font-size: 17px;
    }

    input:focus {
      border-color: #f0c65e;
      box-shadow: 0 0 7px rgba(255, 215, 120, 0.45);
    }

    button {
      width: 100%;
      padding: 17px;

      border: 1px solid #ffe49a;
      border-radius: 13px;

      background: linear-gradient(
        110deg,
        #fff0b5,
        #e9bd50,
        #d19b32
      );

      color: #70213a;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);

      background: linear-gradient(
        110deg,
        #fff7d8,
        #f3d47c,
        #e0ad43
      );
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    /* MOBILE RESPONSIVE */

    @media (max-width: 480px) {
      .login-container {
        max-width: 360px;
        padding: 25px 22px;
      }

      .logo {
        margin-bottom: 45px;
      }

      .logo-flower {
        width: 90px;
        height: 90px;
      }

      .logo-name {
        font-size: 39px;
      }

      h2 {
        font-size: 32px;
      }

      input,
      button {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- YūYū BRAND LOGO -->

    <div class="logo">

      <img
        src="yuyu-flower.png"
        alt="Gold hibiscus flower"
        class="logo-flower"
      >

      <div class="logo-name">YūYū</div>

      <p class="logo-subtitle">
        BEAUTY &amp; GRACE
      </p>

    </div>

    <!-- LOGIN FORM -->

    <h2>Login</h2>

    <form id="loginForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

  </div>

  <script>
    const correctUsername = "admin";
    const correctPassword = "123456";

    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        if (
          username === correctUsername &&
          password === correctPassword
        ) {
          message.style.color = "#d9ffd9";
          message.textContent = "Login successful!";

          setTimeout(function() {
            window.location.href = "homepage.html";
          }, 500);

        } else {
          message.style.color = "#ffe0e8";
          message.textContent =
            "Invalid username or password.";
        }
      });
  </script>

</body>
</html>
