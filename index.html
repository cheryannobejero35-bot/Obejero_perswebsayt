
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YuYu Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;

      background-image: url("front.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      padding: 35px 32px;

      background: rgba(40, 20, 55, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1.5px solid rgba(255, 255, 255, 0.65);
      border-radius: 22px;

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      display: block;
      width: 140px;
      max-width: 65%;
      height: auto;
      object-fit: contain;
      background: transparent;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: white;
      font-size: 38px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 17px;
      margin-bottom: 20px;

      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      outline: none;

      background: rgba(255, 255, 255, 0.95);
      color: #392448;
      font-size: 17px;
    }

    input:focus {
      border-color: #d9a7f5;
      box-shadow: 0 0 0 3px rgba(217, 167, 245, 0.25);
    }

    button {
      display: block;
      width: 100%;
      padding: 17px;

      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ead5f5, #bd8bd7);
      color: #392448;

      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, #f7e8ff, #d5a9eb);
      transform: translateY(-2px);
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
        background-position: center center;
      }

      .login-container {
        width: 100%;
        max-width: 440px;
        padding: 30px 26px;
        border-radius: 20px;
      }

      .logo-container {
        margin-bottom: 18px;
      }

      .logo-container img {
        width: 150px;
      }

      h2 {
        font-size: 36px;
        margin-bottom: 30px;
      }

      input {
        padding: 17px 15px;
        margin-bottom: 20px;
        font-size: 17px;
      }

      button {
        padding: 17px;
        font-size: 18px;
      }
    }

    @media (max-width: 360px) {
      .login-container {
        padding: 26px 20px;
      }

      .logo-container img {
        width: 125px;
      }

      h2 {
        font-size: 32px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      body {
        align-items: flex-start;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .login-container {
        padding: 22px;
      }

      .logo-container {
        margin-bottom: 10px;
      }

      .logo-container img {
        width: 90px;
      }

      h2 {
        margin-bottom: 18px;
      }

      input {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo-container">
      <img src="final logo.png" alt="YuYu three-leaf flower logo">
    </div>

    <h2>Login</h2>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

  </div>

  <script>
    const username = "chery";
    const password = "12345";

    document.getElementById("loginForm")
      .addEventListener("submit", function(e) {
        e.preventDefault();

        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (user === username && pass === password) {
          message.style.color = "#00ff00";
          message.textContent = "Login successful!";

          setTimeout(function() {
            window.location.href = "homepage.html";
          }, 1500);

        } else {
          message.style.color = "#ff3333";
          message.textContent =
            "Invalid username or password.";
        }
      });
  </script>

</body>
</html>
